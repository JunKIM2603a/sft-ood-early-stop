experiment:
  name: stage1_generalpoints_reproduction
  stage: 1
  status: frozen_for_implementation
  frozen_date: "2026-09-23"
  purpose: reproduce_nonmonotonic_ood_dynamics_before_proxy_development

model:
  name_or_path: Qwen/Qwen2.5-3B-Instruct
  parameters_billion: 3.086
  dtype: bf16
  quantization: none

adaptation:
  method: lora
  r: 32
  alpha: 16
  dropout: 0.0
  target_modules: all-linear
  gradient_checkpointing: true

data:
  sft_train_source: Xiaofeng77/answer-only-gp-l-only-10k
  evaluation_source: Xiaofeng77/gp-l-only-10k
  id_rule: "J=Q=K=10"
  ood_rule: "J=11,Q=12,K=13 (face cards as regular values)"
  train:
    split: train
    subset_size: 4096
    shuffle_seed: 20260923
    supervision: answer_only
  anchor:
    source: "same shuffled answer-only train split, immediately after the 4096 SFT examples"
    size: 512
    labels_visible_to_selector: false
    disjoint_from_sft_train: true
  id_validation:
    split_preference: [test_id, test]
    semantic_check: "must verify J=Q=K=10 from metadata/prompt"
    use_full_official_split: true
  ood_oracle:
    split: test_face_cards_as_regular
    semantic_check: "must verify J=11,Q=12,K=13 from metadata/prompt"
    use_full_official_split: true
    labels_visible_to_selector: false

training:
  objective: autoregressive_cross_entropy
  epochs: 3
  learning_rates: [5.0e-6, 1.0e-5, 5.0e-5]
  seeds: [42, 43]
  max_sequence_length: 2048
  effective_batch_size: 64
  scheduler: cosine
  warmup_ratio: 0.03
  weight_decay: 0.0

checkpointing:
  save_every_optimizer_steps: 10
  evaluate_every_saved_checkpoint: true
  include_step_zero_base_model: true
  expected_steps_per_epoch: 64
  expected_total_steps: 192
  keep_all_stage1_checkpoints: true

metrics:
  train: [loss]
  id: [validation_loss, task_success_accuracy]
  ood_oracle: [task_success_accuracy]
  drift:
    - parameter_l2
    - lora_update_frobenius
    - functional_kl
    - singular_value_change
    - singular_vector_principal_angle
  later_baseline: [crc, oplora_rho_k_optional]

selection:
  oracle:
    metric: ood_task_success_accuracy
    allowed_for_final_evaluation_only: true
  baselines:
    - train_loss
    - id_validation_loss
    - id_task_success
    - fixed_step
    - parameter_l2
    - crc
  proposed:
    - functional_kl
    - spectral_rotation
    - combined_proxy
  primary_endpoint: regret

forgetting_definition:
  peak_must_be_non_final: true
  later_checkpoints_below_peak_min_count: 2
  min_decline_rule: "max(5 percentage points, 2 * binomial standard error using actual OOD split size)"
  require_no_equally_large_synchronized_id_collapse: true

stage1_gate:
  go: "At least 2 of 6 LR×seed runs satisfy the predeclared clear peak-to-decline criterion."
  conditional_go: "Only 1 run, only aggressive LR, strong seed dependence, prompt-diversity sensitivity, or dip-to-recovery/non-universal dynamics."
  kill_or_pivot: "No meaningful non-monotonic OOD deterioration after the six LoRA runs and the predeclared full-FT capacity sentinel."

boundary_controls:
  prompt_diversity_after_go:
    enabled: true
    dataset: Xiaofeng77/diverse-answer-only-gp-l-only-10k
    learning_rate: 1.0e-5
    seeds: [42, 43]
    epochs: 3
  capacity_sentinel_before_kill:
    enabled_if_all_lora_runs_null: true
    method: full_finetuning
    model: Qwen/Qwen2.5-3B-Instruct
    learning_rate: 1.0e-6
    epochs: 1
    effective_batch_size: 64

hardware:
  gpus: "2 x RTX 4090 24GB"
  parallelization: "one LR/seed run per GPU"
